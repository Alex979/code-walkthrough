name: Deploy walkthrough demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/package-demo.ts"
      - "skills/code-walkthrough/assets/viewer/**"
      - "skills/code-walkthrough/examples/greeting/**"
      - "skills/code-walkthrough/scripts/validate.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/configure-pages@v5
      - name: Validate and package the bundled example
        run: bun run build:demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/demo

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
